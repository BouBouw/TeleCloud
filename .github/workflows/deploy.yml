name: Deploy to VPS

# Auto-deploy on every push to main (front + back + bot). Also runnable manually.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'bot/**'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never run two production deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /var/www/vibot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          # ensure rsync exists on the VPS (receiving end)
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'command -v rsync >/dev/null || (apt-get update -qq && apt-get install -y -qq rsync)'

      - name: Upload frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            web/dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/web/dist/"

      - name: Upload backend
        run: |
          SSH='ssh -i ~/.ssh/id_ed25519'
          TARGET="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          rsync -az --delete -e "$SSH" server/dist/    "${TARGET}:${APP_DIR}/server/dist/"
          rsync -az --delete -e "$SSH" server/prisma/  "${TARGET}:${APP_DIR}/server/prisma/"
          rsync -az        -e "$SSH" server/package.json server/package-lock.json "${TARGET}:${APP_DIR}/server/"
          rsync -az        -e "$SSH" deploy/ecosystem.config.js "${TARGET}:${APP_DIR}/"
          # optional python helper scripts used by the server (best-effort)
          rsync -az -e "$SSH" server/scripts/ "${TARGET}:${APP_DIR}/server/scripts/" || true

      - name: Upload bot
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            bot/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${APP_DIR}/bot/"

      - name: Remote release (migrate, PM2, docker, nginx)
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' < deploy/release.sh
