<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Title & primary SEO ─────────────────────────────────────────── -->
    <title>Vibot — Diffusion musicale Telegram</title>
    <meta name="description" content="Gérez votre bibliothèque musicale, créez des montages vidéo et diffusez automatiquement sur Telegram et les réseaux sociaux." />
    <meta name="keywords" content="telegram bot, diffusion musicale, bibliothèque, montage vidéo, broadcast" />
    <meta name="author" content="Vibot" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- ── Theme & color scheme ────────────────────────────────────────── -->
    <meta name="theme-color" content="#f0a830" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Vibot" />

    <!-- ── Open Graph ──────────────────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Vibot" />
    <meta property="og:title"       content="Vibot — Diffusion musicale Telegram" />
    <meta property="og:description" content="Gérez votre bibliothèque musicale et diffusez automatiquement sur Telegram." />
    <meta property="og:url"         content="https://vibot.cloud" />
    <meta property="og:image"       content="https://vibot.cloud/og-image.png" />
    <meta property="og:locale"      content="fr_FR" />

    <!-- ── Twitter / X Card ───────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Vibot — Diffusion musicale Telegram" />
    <meta name="twitter:description" content="Gérez votre bibliothèque musicale et diffusez automatiquement sur Telegram." />
    <meta name="twitter:image"       content="https://vibot.cloud/og-image.png" />

    <!-- ── Favicon & PWA ─────────────────────────────────────────────── -->
    <link rel="icon"             type="image/x-icon"   href="/favicon.ico" />
    <link rel="icon"             type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon"             type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon"             type="image/svg+xml"  href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180"        href="/apple-touch-icon.png" />
    <link rel="manifest"                               href="/site.webmanifest" />
    <link rel="canonical"                              href="https://vibot.cloud" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
